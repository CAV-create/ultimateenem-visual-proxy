openapi: 3.1.0
info:
  title: ultimateENEM Visual Proxy
  version: 1.3.0
  description: Proxy privado para PDFs, recortes e pranchas de auditoria ENEM. Use Chave API no header Authorization; nao use OAuth.
servers:
  - url: https://ultimateenem-visual-proxy.onrender.com
security:
  - ApiKeyAuth: []
paths:
  /v1/dropbox/test-refresh:
    post:
      operationId: testar_oauth_dropbox_proxy
      summary: Testa o refresh do Dropbox pelo proxy.
      description: Valida se o proxy consegue renovar o token do Dropbox.
      responses:
        "200":
          description: Token renovado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/dropbox/search:
    post:
      operationId: buscar_pdf_dropbox
      summary: Busca arquivos no Dropbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                path:
                  type: string
                  default: /ENEM 2026 App
                max_results:
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 50
      responses:
        "200":
          description: Resultados encontrados.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/pdf/render-page:
    post:
      operationId: renderizar_pagina_pdf
      summary: Renderiza uma pagina inteira de PDF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pdf_path, page_number]
              properties:
                pdf_path:
                  type: string
                page_number:
                  type: integer
                  minimum: 1
                dpi:
                  type: integer
                  default: 220
                  minimum: 96
                  maximum: 360
                output_folder:
                  type: string
                output_name:
                  type: string
                image_format:
                  type: string
                  enum: [png, webp]
                  default: png
                webp_quality:
                  type: integer
                  default: 88
                  minimum: 40
                  maximum: 100
      responses:
        "200":
          description: Pagina renderizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualOperationResponse"
  /v1/pdf/crop:
    post:
      operationId: recortar_recurso_visual_pdf
      summary: Recorta uma regiao de uma pagina de PDF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pdf_path, page_number, bbox, output_basename]
              properties:
                pdf_path:
                  type: string
                page_number:
                  type: integer
                  minimum: 1
                bbox:
                  type: object
                  additionalProperties: false
                  required: [x, y, w, h]
                  properties:
                    x:
                      type: number
                    y:
                      type: number
                    w:
                      type: number
                    h:
                      type: number
                units:
                  type: string
                  enum: [normalized, pixels]
                  default: normalized
                dpi:
                  type: integer
                  default: 220
                  minimum: 96
                  maximum: 360
                pad_px:
                  type: integer
                  default: 18
                  minimum: 0
                  maximum: 120
                output_folder:
                  type: string
                output_basename:
                  type: string
                make_png:
                  type: boolean
                  default: true
                make_webp:
                  type: boolean
                  default: true
                webp_quality:
                  type: integer
                  default: 88
                  minimum: 40
                  maximum: 100
      responses:
        "200":
          description: Recorte salvo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualOperationResponse"
  /v1/audit/create-board:
    post:
      operationId: criar_prancha_auditoria_visual
      summary: Cria prancha HTML lado a lado.
      description: Cria HTML com original a esquerda, tratado a direita, checkboxes de erro, motivo livre e botao de copiar parecer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [audit_title, board_kind, expected_case_count, output_name, cases]
              properties:
                audit_title:
                  type: string
                board_kind:
                  type: string
                  enum: [localizacao, final]
                  description: localizacao aceita sem tratado; final exige tratado valido.
                expected_case_count:
                  type: integer
                  minimum: 1
                  maximum: 80
                output_folder:
                  type: string
                output_name:
                  type: string
                cases:
                  type: array
                  minItems: 1
                  maxItems: 80
                  items:
                    $ref: "#/components/schemas/AuditCaseInput"
      responses:
        "200":
          description: Prancha criada no Dropbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditBoardResponse"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Cole Bearer seguido da VISUAL_PROXY_API_KEY.
  schemas:
    AuditCaseInput:
      type: object
      additionalProperties: true
      required: [case_id, title, original_path]
      properties:
        case_id:
          type: string
        title:
          type: string
        original_path:
          type: string
          description: Imagem/PDF bruto renderizado para comparar.
        treated_path:
          type: string
          description: Imagem tratada; obrigatoria quando board_kind=final.
        notes:
          type: string
    UploadedAsset:
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
        dropbox_path:
          type: string
        temporary_link:
          type: string
        bytes:
          type: integer
        width:
          type: integer
        height:
          type: integer
    VisualOperationResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        pdf_path:
          type: string
        page_number:
          type: integer
        dpi:
          type: integer
        page_width:
          type: integer
        page_height:
          type: integer
        crop_box_pixels:
          type: array
          items:
            type: integer
        assets:
          type: array
          items:
            $ref: "#/components/schemas/UploadedAsset"
    AuditBoardResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        audit_title:
          type: string
        board_kind:
          type: string
        case_count:
          type: integer
        expected_case_count:
          type: integer
        dropbox_path:
          type: string
        temporary_link:
          type: string
