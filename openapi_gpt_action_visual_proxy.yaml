openapi: 3.1.0
info:
  title: ultimateENEM Visual Proxy
  version: 1.2.0
  description: >
    Proxy do ultimateENEM para localizar PDFs no Dropbox, renderizar paginas,
    recortar recursos visuais e criar pranchas HTML de auditoria visual. O GPT
    deve autenticar com Chave API no header Authorization; nao use OAuth no GPT Builder.
servers:
  - url: https://ultimateenem-visual-proxy.onrender.com
security:
  - ApiKeyAuth: []
paths:
  /v1/dropbox/test-refresh:
    post:
      operationId: testar_oauth_dropbox_proxy
      summary: Testa se o proxy consegue renovar o token do Dropbox.
      description: >
        Use este teste antes de buscar PDFs. Se falhar com invalid_client,
        o problema esta nas variaveis DROPBOX_APP_KEY, DROPBOX_APP_SECRET ou
        DROPBOX_REFRESH_TOKEN no Render. Esta action usa a chave do proxy no
        header Authorization; nao usa OAuth no GPT Builder.
      responses:
        "200":
          description: Token Dropbox renovado com sucesso pelo proxy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  dropbox_refresh_configured:
                    type: boolean
  /v1/dropbox/search:
    post:
      operationId: buscar_pdf_dropbox
      summary: Busca PDFs ou arquivos no Dropbox do projeto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  description: Nome parcial do PDF ou trecho do caminho.
                path:
                  type: string
                  default: /ENEM 2026 App
                  description: Pasta inicial do Dropbox.
                max_results:
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 50
      responses:
        "200":
          description: Resultados encontrados no Dropbox.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                        path_display:
                          type: string
                        id:
                          type: string
                        client_modified:
                          type: string
  /v1/pdf/render-page:
    post:
      operationId: renderizar_pagina_pdf
      summary: Renderiza uma pagina inteira de um PDF do Dropbox e salva no Dropbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pdf_path, page_number]
              properties:
                pdf_path:
                  type: string
                  description: Caminho completo do PDF no Dropbox.
                page_number:
                  type: integer
                  minimum: 1
                  description: Numero da pagina do PDF, iniciando em 1.
                dpi:
                  type: integer
                  default: 220
                  minimum: 96
                  maximum: 360
                output_folder:
                  type: string
                  description: Pasta Dropbox de saida.
                output_name:
                  type: string
                  description: Nome base do arquivo sem extensao.
                image_format:
                  type: string
                  enum: [png, webp]
                  default: png
                webp_quality:
                  type: integer
                  default: 88
                  minimum: 40
                  maximum: 100
      responses:
        "200":
          description: Pagina renderizada e salva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualOperationResponse"
  /v1/pdf/crop:
    post:
      operationId: recortar_recurso_visual_pdf
      summary: Recorta uma regiao de uma pagina de PDF do Dropbox e salva PNG/WebP no Dropbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pdf_path, page_number, bbox, output_basename]
              properties:
                pdf_path:
                  type: string
                  description: Caminho completo do PDF no Dropbox.
                page_number:
                  type: integer
                  minimum: 1
                  description: Numero da pagina do PDF, iniciando em 1.
                bbox:
                  type: object
                  additionalProperties: false
                  required: [x, y, w, h]
                  properties:
                    x:
                      type: number
                    y:
                      type: number
                    w:
                      type: number
                    h:
                      type: number
                units:
                  type: string
                  enum: [normalized, pixels]
                  default: normalized
                  description: normalized usa coordenadas entre 0 e 1; pixels usa coordenadas da pagina renderizada.
                dpi:
                  type: integer
                  default: 220
                  minimum: 96
                  maximum: 360
                pad_px:
                  type: integer
                  default: 10
                  minimum: 0
                  maximum: 120
                  description: Sangria/margem controlada ao redor do recurso.
                output_folder:
                  type: string
                  description: Pasta Dropbox de saida.
                output_basename:
                  type: string
                  description: Nome base dos arquivos gerados sem extensao.
                make_png:
                  type: boolean
                  default: true
                make_webp:
                  type: boolean
                  default: true
                webp_quality:
                  type: integer
                  default: 88
                  minimum: 40
                  maximum: 100
      responses:
        "200":
          description: Recurso visual recortado e salvo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualOperationResponse"
  /v1/audit/create-board:
    post:
      operationId: criar_prancha_auditoria_visual
      summary: Cria uma prancha HTML de auditoria com original e tratado lado a lado.
      description: >
        Use esta action depois de renderizar/recortar/tratar as imagens. Ela nao
        devolve links soltos: cria um HTML no Dropbox com cada caso aberto na tela,
        original/PDF bruto na esquerda, imagem tratada na direita, checkbox
        HOMOLOGADA, campo livre para motivo e botao de copiar parecer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audit_title, cases, output_name]
              properties:
                audit_title:
                  type: string
                  default: AUDITORIA VISUAL
                  description: Titulo da prancha, por exemplo AUDITORIA - BLOCO 28.
                output_folder:
                  type: string
                  description: Pasta Dropbox de saida; se vazio usa DROPBOX_OUTPUT_ROOT.
                output_name:
                  type: string
                  description: Nome base do HTML sem extensao.
                cases:
                  type: array
                  minItems: 1
                  maxItems: 80
                  items:
                    type: object
                    additionalProperties: false
                    required: [case_id, title, original_path]
                    properties:
                      case_id:
                        type: string
                        description: Identificador curto do caso, como Q07.
                      title:
                        type: string
                        description: Titulo curto exibido na prancha.
                      original_path:
                        type: string
                        description: Caminho Dropbox da pagina/recorte bruto original.
                      treated_path:
                        type: string
                        description: Caminho Dropbox da imagem tratada final, se ja existir.
                      notes:
                        type: string
                        description: Observacao interna opcional.
      responses:
        "200":
          description: Prancha HTML criada e salva no Dropbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditBoardResponse"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Use o valor Bearer seguido da chave VISUAL_PROXY_API_KEY. Nao use OAuth.
  schemas:
    UploadedAsset:
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [png, webp]
        dropbox_path:
          type: string
        temporary_link:
          type: string
        bytes:
          type: integer
        width:
          type: integer
        height:
          type: integer
    VisualOperationResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        pdf_path:
          type: string
        page_number:
          type: integer
        dpi:
          type: integer
        page_width:
          type: integer
        page_height:
          type: integer
        crop_box_pixels:
          type: array
          description: Vazio quando a pagina inteira foi renderizada; no recorte vem [x1, y1, x2, y2].
          items:
            type: integer
        assets:
          type: array
          items:
            $ref: "#/components/schemas/UploadedAsset"
    AuditBoardResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        audit_title:
          type: string
        case_count:
          type: integer
        dropbox_path:
          type: string
        temporary_link:
          type: string
